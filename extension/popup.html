<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>Meet 自動截圖</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f4f6f8;
      --border: #e2e6ea;
      --text: #1f2328;
      --muted: #5f6b76;
      --accent: #0b8043;
      --accent-ink: #ffffff;
      --accent-soft: #e6f4ea;
      --danger: #d93025;
      --danger-soft: #fce8e6;
      --warn: #b06000;
      --warn-soft: #fef7e0;
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17191c;
        --surface: #202327;
        --border: #30353b;
        --text: #e8eaed;
        --muted: #9aa4ae;
        --accent: #34a853;
        --accent-ink: #0b1a10;
        --accent-soft: #16301f;
        --danger: #f28b82;
        --danger-soft: #3a1f1d;
        --warn: #fdd663;
        --warn-soft: #3a3115;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 340px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
    }
    header img { width: 28px; height: 28px; }
    header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
    header .sub { color: var(--muted); font-size: 11.5px; }
    .pill {
      margin-left: auto; padding: 3px 9px; border-radius: 999px;
      font-size: 11.5px; font-weight: 600; white-space: nowrap;
      background: var(--surface); color: var(--muted);
    }
    .pill.rec { background: var(--danger-soft); color: var(--danger); }
    .pill.rec::before {
      content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: var(--danger); margin-right: 6px; vertical-align: 1px;
      animation: blink 1.2s infinite;
    }
    .pill.wait { background: var(--accent-soft); color: var(--accent); }
    @keyframes blink { 50% { opacity: .25; } }

    main { padding: 14px 16px 16px; display: grid; gap: 14px; }

    .stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .stat {
      background: var(--surface); border-radius: 10px; padding: 8px 10px;
    }
    .stat b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--muted); font-size: 11px; }

    label.field { display: grid; gap: 6px; }
    .label { font-weight: 600; font-size: 12px; color: var(--muted); }

    .interval { display: flex; align-items: center; gap: 8px; }
    .interval input {
      width: 84px; padding: 8px 10px; font: inherit; font-size: 15px; font-weight: 600;
      border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .interval input:focus, .text:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer;
    }
    .chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

    .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-radius: 10px; padding: 3px; gap: 3px; }
    .seg input { display: none; }
    .seg label {
      text-align: center; padding: 6px 4px; border-radius: 8px; cursor: pointer;
      font-size: 12px; color: var(--muted); user-select: none;
    }
    .seg input:checked + label { background: var(--bg); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
    .hint { color: var(--muted); font-size: 11.5px; margin: 0; }

    .row { display: flex; gap: 8px; align-items: center; }
    select, .text {
      font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text);
    }
    .text { width: 100%; }
    input[type="range"] { flex: 1; accent-color: var(--accent); }

    .toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; }
    .toggle input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--border); position: relative; cursor: pointer; flex: none; transition: background .15s; }
    .toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
    .toggle input:checked { background: var(--accent); }
    .toggle input:checked::after { transform: translateX(14px); }
    .toggle small { display: block; color: var(--muted); font-size: 11px; }

    details { border-top: 1px solid var(--border); padding-top: 10px; }
    details summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: 12px; }
    details[open] summary { margin-bottom: 10px; }
    details .stack { display: grid; gap: 12px; }

    .actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    button.primary {
      border: 0; border-radius: 10px; padding: 11px 12px; font: inherit; font-size: 14px; font-weight: 650;
      background: var(--accent); color: var(--accent-ink); cursor: pointer;
    }
    button.primary.stop { background: #d93025; color: #fff; }
    button.secondary {
      border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; font: inherit;
      background: var(--bg); color: var(--text); cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .msg { border-radius: 8px; padding: 8px 10px; font-size: 12px; margin: 0; }
    .msg.error { background: var(--danger-soft); color: var(--danger); }
    .msg.warn { background: var(--warn-soft); color: var(--warn); }
    .msg.ok { background: var(--accent-soft); color: var(--accent); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" />
    <div>
      <h1>Meet 自動截圖</h1>
      <div class="sub" id="meetingCode">尚未偵測到會議</div>
    </div>
    <span class="pill" id="statusPill">—</span>
  </header>

  <main>
    <p class="msg warn" id="notMeet" hidden>請先切換到 Google Meet 會議分頁（meet.google.com），再開啟這個面板。</p>

    <div class="stats">
      <div class="stat"><b id="statCount">0</b><span>已存張數</span></div>
      <div class="stat"><b id="statLast">—</b><span>上一張</span></div>
      <div class="stat"><b id="statNext">—</b><span>下一張</span></div>
    </div>

    <label class="field">
      <span class="label">擷取間隔（秒）</span>
      <div class="interval">
        <input type="number" id="interval" min="1" max="3600" step="1" inputmode="numeric" />
        <div class="chips" id="chips">
          <button type="button" class="chip" data-v="5">5</button>
          <button type="button" class="chip" data-v="10">10</button>
          <button type="button" class="chip" data-v="30">30</button>
          <button type="button" class="chip" data-v="60">60</button>
        </div>
      </div>
    </label>

    <div class="field">
      <span class="label">擷取內容</span>
      <div class="seg" role="radiogroup">
        <input type="radio" name="mode" id="m-main" value="video-main" /><label for="m-main">主畫面視訊</label>
        <input type="radio" name="mode" id="m-all" value="video-all" /><label for="m-all">所有視訊</label>
        <input type="radio" name="mode" id="m-tab" value="tab" /><label for="m-tab">整個分頁</label>
      </div>
      <p class="hint" id="modeHint"></p>
    </div>

    <label class="toggle">
      <span>進入會議時自動開始<small>離開會議會自動停止</small></span>
      <input type="checkbox" id="autoStart" />
    </label>

    <details>
      <summary>進階設定</summary>
      <div class="stack">
        <div class="field">
          <span class="label">圖片格式</span>
          <div class="row">
            <select id="format">
              <option value="png">PNG（無損，最高畫質）</option>
              <option value="jpeg">JPEG（檔案較小）</option>
            </select>
          </div>
          <div class="row" id="qualityRow" hidden>
            <span class="hint">品質</span>
            <input type="range" id="quality" min="50" max="100" step="1" />
            <b id="qualityVal" style="width:28px;text-align:right">92</b>
          </div>
        </div>
        <label class="field">
          <span class="label">下載資料夾（位於 Chrome 預設下載位置內）</span>
          <input type="text" class="text" id="folder" placeholder="Meet-Screenshots" />
        </label>
        <label class="toggle">
          <span>略過重複畫面<small>畫面沒有變化（例如同一張投影片）就不存檔</small></span>
          <input type="checkbox" id="skipDuplicates" />
        </label>
      </div>
    </details>

    <p class="msg" id="message" hidden></p>

    <div class="actions">
      <button class="primary" id="toggleBtn" disabled>開始擷取</button>
      <button class="secondary" id="snapBtn" title="立即擷取一張" disabled>拍一張</button>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
